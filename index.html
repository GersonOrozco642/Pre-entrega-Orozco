<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Ahorcado</title>
</head>
<body>
    <div class="game">
        <header class="game-header">
            <h1>Ahorcado<span class="dot">.</span></h1>
            <span id="dificultad" class="badge">fácil</span>
        </header>

        <div class="game-board">
            <div class="hangman-box">
                <svg id="ahorcado" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
                    <line x1="10" y1="210" x2="130" y2="210" class="soporte"></line>
                    <line x1="40" y1="210" x2="40" y2="20" class="soporte"></line>
                    <line x1="40" y1="20" x2="120" y2="20" class="soporte"></line>
                    <line x1="120" y1="20" x2="120" y2="45" class="soporte"></line>

                    <circle id="parte-cabeza" cx="120" cy="65" r="20" class="parte"></circle>
                    <line id="parte-cuerpo" x1="120" y1="85" x2="120" y2="140" class="parte"></line>
                    <line id="parte-brazo-izq" x1="120" y1="95" x2="95" y2="120" class="parte"></line>
                    <line id="parte-brazo-der" x1="120" y1="95" x2="145" y2="120" class="parte"></line>
                    <line id="parte-pierna-izq" x1="120" y1="140" x2="98" y2="180" class="parte"></line>
                    <line id="parte-pierna-der" x1="120" y1="140" x2="142" y2="180" class="parte"></line>
                </svg>
                <p id="vidas">6 intentos restantes</p>
            </div>

            <div class="word-box">
                <div id="palabra" class="palabra"></div>
                <p id="mensajes" class="mensajes"></p>
                <div id="teclado" class="teclado"></div>
                <button id="reiniciar" class="btn-reiniciar">Nueva palabra</button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
